<!DOCTYPE html>
<html lang="zh-CN" data-theme="halloween">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1330">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">

<title>不给糖就捣蛋</title>
<meta name="description" content="一张给你的小卡片">

<link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<canvas class="sparks" id="sparks" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="progress" id="progress" aria-hidden="true"></div>
<div class="year-chip" id="yearChip" aria-hidden="true"></div>

<!-- 口令门 -->
<div class="gate" id="gate">
  <div class="gate-inner">
    <p class="gate-kicker" id="gateKicker"></p>
    <h1 class="sticker gate-title" id="gateTitle"></h1>
    <p class="gate-hint" id="gateHint"></p>

    <form class="gate-form" id="gateForm" autocomplete="off">
      <input class="gate-input" id="gateInput" type="password" aria-label="口令" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="gate-btn" id="gateBtn" type="submit"></button>
    </form>

    <p class="gate-wrong" id="gateWrong" aria-live="polite"></p>
  </div>
</div>

<div class="page">

  <!-- ============ 封面 ============ -->
  <header class="hero" id="top">
    <div class="moon" aria-hidden="true"></div>
    <div class="bats" aria-hidden="true">
      <span class="bat bat--1"></span>
      <span class="bat bat--2"></span>
      <span class="bat bat--3"></span>
    </div>

    <p class="kicker" id="coverKicker"></p>
    <h1 class="sticker hero-title" id="coverTitle"></h1>
    <p class="hero-sub" id="coverSub"></p>

    <button class="btn-start" id="startBtn" type="button"></button>
  </header>

  <!-- ============ 一年一章，由 JS 生成 ============ -->
  <main id="story"></main>

  <!-- ============ 收尾：门 → 给糖/捣蛋 → 信 ============ -->
  <section class="finale" id="finale">

    <div class="finale-block" id="finaleDoor">
      <p class="hint" id="finaleHint"></p>

      <button class="house" id="houseBtn" type="button" aria-label="敲门">
        <span class="roof" aria-hidden="true"></span>
        <span class="wall" aria-hidden="true">
          <span class="window window--l"></span>
          <span class="window window--r"></span>
          <span class="doorway">
            <span class="door-light"></span>
            <span class="door-leaf"><span class="knob"></span></span>
          </span>
        </span>
      </button>

      <p class="hint hint--knock" id="knockHint"></p>
    </div>

    <div class="finale-block" id="finaleChoice" hidden>
      <h2 class="sticker title" id="choiceTitle"></h2>
      <p class="sub" id="choiceSub"></p>

      <div class="choice-row">
        <button class="btn btn--accent" id="treatBtn" type="button"></button>
        <button class="btn btn--ghost" id="trickBtn" type="button"></button>
      </div>

      <p class="line" id="choiceLine"></p>
    </div>

    <div class="finale-block" id="finaleLetter" hidden>
      <p class="hint" id="envelopeHint"></p>

      <button class="envelope" id="envelopeBtn" type="button">
        <span class="env-back" aria-hidden="true"></span>
        <span class="env-note" aria-hidden="true"></span>
        <span class="env-front" aria-hidden="true"></span>
        <span class="env-flap" aria-hidden="true"></span>
        <span class="env-seal" aria-hidden="true">♥</span>
        <span class="sr-only">打开信</span>
      </button>

      <article class="letter" id="letter" hidden>
        <p class="letter-to" id="letterTo"></p>
        <div class="letter-body" id="letterBody"></div>
        <p class="letter-sign" id="letterSign" hidden>
          <span id="signText"></span>
          <small id="byeText"></small>
        </p>
      </article>

      <button class="replay" id="replayBtn" type="button" hidden></button>
    </div>

  </section>

  <footer class="foot" aria-hidden="true"></footer>

</div>

<nav class="year-rail" id="yearRail" hidden aria-label="年份"></nav>

<div class="lightbox" id="lightbox" hidden>
  <img id="lbImg" alt="">
  <p class="lb-cap" id="lbCap"></p>
</div>

<button class="sound" id="soundBtn" type="button" aria-label="声音开关">🔊</button>

<noscript>
  <p style="text-align:center;color:#FFF4E6;font:16px/1.6 sans-serif;padding:40px 20px">这个页面需要打开 JavaScript 才能看。</p>
</noscript>

<script src="config.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>
