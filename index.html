<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<title>周末活动小助手</title>
<style>
:root{
  --bg:#FAF7F2;
  --card:#FFFFFF;
  --ink:#2A2622;
  --ink2:#6E655C;
  --ink3:#A79C90;
  --line:#EAE2D6;
  --accent:#E8674A;
  --accent-soft:#FDEDE8;
  --green:#3E7C68;
  --meal:#FFFBF3;
  --night:#F6F5FB;
  --late:#F7F7F4;
  --radius:16px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.5;overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
input{font-family:inherit;font-size:inherit;color:inherit}

.app{max-width:460px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* ---------- 顶部 ---------- */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 0 4px}
.topbar-left{flex:1;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.2px}
.brand small{font-weight:500;color:var(--ink3);font-size:12px;margin-left:6px;letter-spacing:0}
.subline{margin-top:4px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.group-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--ink2)}
.group-chip:active{background:#F3EEE6}
.me-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;flex:none;box-shadow:0 1px 2px rgba(42,38,34,.04)}
.me-chip:active{background:#F7F3EC}
.me-chip .nm{font-size:12.5px;font-weight:600;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip .caret{font-size:9px;color:var(--ink3)}

.avatar{
  width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;
  font-size:11.5px;font-weight:700;color:#fff;flex:none;letter-spacing:0;
}
.avatar.sm{width:22px;height:22px;font-size:10.5px}

/* ---------- 提示条 ---------- */
.hint{
  display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;margin-top:14px;font-size:12.5px;color:var(--ink2);
  box-shadow:0 1px 3px rgba(42,38,34,.04);line-height:1.45;
}
.hint b{color:var(--ink);font-weight:600}
.hint button{flex:none;font-size:12px;color:var(--accent);font-weight:600;padding:4px 6px}
.pending-note{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10.5px;color:#B4462B;background:var(--accent-soft);
  border-radius:999px;padding:3px 8px;font-weight:600;white-space:nowrap;
}
.pending-note b{font-weight:800}

/* ---------- 日期 ---------- */
.day{margin-top:22px}
.day-head{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;padding-left:2px}
.day-name{font-size:15px;font-weight:700}
.day-date{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.day-tag{margin-left:auto;font-size:11px;color:var(--ink3);background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px}

/* ---------- 周视图 ---------- */
.week{margin-top:20px}
.week-head{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:end;padding-bottom:7px}
.wh-day{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.wh-day b{font-size:14px;font-weight:700}
.wh-day span{font-size:10.5px;color:var(--ink3);margin-top:2px;font-variant-numeric:tabular-nums}
.week-grid{display:grid;grid-template-columns:52px 1fr 1fr;grid-auto-rows:64px;gap:8px;position:relative}

.slot-label{display:flex;flex-direction:column;justify-content:center;padding-right:2px;min-width:0}
.slot-label .bl{font-size:12.5px;font-weight:650;color:var(--ink2);white-space:nowrap;line-height:1.2}
.slot-label .bt{font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.slot-label[data-kind="late"] .bl,.slot-label[data-kind="late"] .bt{color:#BDB5A9}

.slot{
  border-radius:13px;border:1.5px dashed transparent;position:relative;
  z-index:0;transition:background .14s,border-color .14s,box-shadow .14s;
}
.slot[data-kind="meal"]{background:var(--meal)}
.slot[data-kind="night"]{background:var(--night)}
.slot[data-kind="late"]{background:var(--late)}
.slot.free{border-color:#E6DDD0}
.slot.free::after{
  content:"+";position:absolute;inset:0;display:grid;place-items:center;
  font-size:19px;font-weight:300;color:#CFC5B6;
}
.slot.free:active{background:#F5EFE5}
.slot.insel{background:var(--accent-soft);border-color:var(--accent);border-style:solid;box-shadow:0 0 0 3px rgba(232,103,74,.10)}
.slot.insel::after{color:var(--accent);font-weight:400}
.slot.taken{background:transparent;border-color:transparent}

/* ---------- 活动卡片 ---------- */
.act{
  position:relative;z-index:1;display:flex;flex-direction:column;
  background:var(--card);border-radius:12px;border:1px solid var(--line);
  border-left:3px solid var(--c,var(--accent));
  padding:8px 7px 7px 9px;overflow:hidden;text-align:left;
  box-shadow:0 1px 2px rgba(42,38,34,.05),0 4px 10px -6px rgba(42,38,34,.16);
  transition:transform .12s;
}
.act:active{transform:scale(.97)}
.act-top{display:flex;align-items:flex-start;gap:4px;min-width:0;padding-right:11px}
.act-emoji{font-size:13px;line-height:1.25;flex:none}
.act-name{
  font-size:12px;font-weight:700;letter-spacing:-.1px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.act-place{margin-top:3px;font-size:10px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-bottom{margin-top:auto;padding-top:5px;display:flex;align-items:center;gap:4px}
.pile{display:flex;align-items:center;min-width:0}
.pile .avatar{width:18px;height:18px;font-size:9px;border:1.5px solid #fff;margin-left:-5px}
.pile .avatar:first-child{margin-left:0}
.pile .more{
  width:18px;height:18px;border-radius:50%;background:#F1EBE2;color:var(--ink2);
  display:inline-grid;place-items:center;font-size:8.5px;font-weight:700;border:1.5px solid #fff;margin-left:-5px;
}
.st-dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;flex:none}
.st-dot.in{background:#2C6B52;box-shadow:0 0 0 2.5px #E7F3EC}
.st-dot.maybe{background:#D9A93C;box-shadow:0 0 0 2.5px #FFF4DC}
.act[data-span="1"] .act-place{display:none}
.act[data-span="1"] .act-name{font-size:11.5px}
.act-note{
  margin-top:5px;font-size:10px;color:var(--ink3);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.mini-segs{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.mseg{display:flex;align-items:center;gap:3px;font-size:9.5px;color:var(--ink3);line-height:1.3}
.mseg .ml{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mseg .mn{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.mseg .mq{color:#B98A24;font-weight:600}
.mseg.mi-in .mn{color:#2C6B52}
.mseg.mi-maybe .mn{color:#9A6B12}
.act[data-span="1"] .act-note,
.act[data-span="1"] .mini-segs{display:none}

.act[data-span="1"] .act-sub{display:none}
.act[data-span="1"] .act-note{display:none}
.act-segs{margin-top:10px;display:flex;gap:5px;flex-wrap:wrap}
.seg{display:inline-flex;align-items:center;gap:3px;background:#F6F1E8;border-radius:7px;padding:2px 6px;font-size:10.5px;color:var(--ink3);line-height:1.45;white-space:nowrap}
.seg .sl{font-weight:600}
.seg .sn{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.seg .q{color:#B98A24;font-weight:600}
.seg.mine-in{background:#E7F3EC;color:#2C6B52}
.seg.mine-in .sn{color:#2C6B52}
.seg.mine-maybe{background:#FFF4DC;color:#9A6B12}
.seg.mine-maybe .sn{color:#9A6B12}
.seg.mine-out{background:#EDE7DD;color:#8A8178}
.seg.mine-out .sn{color:#8A8178}
.seg.ghost{background:transparent;border:1px dashed #D9CFBF;color:var(--ink3)}
.seg.ghost .sn{color:var(--ink3)}
.act[data-span="1"] .act-segs{display:none}
.act[data-span="1"] .act-bottom{padding-top:6px}
.act[data-span="1"] .act-name{font-size:13.5px}
.act[data-span="1"] .act-emoji{font-size:14px}

/* ---------- 选择浮条 ---------- */
.selectbar{
  position:fixed;left:50%;bottom:18px;transform:translate(-50%,calc(100% + 32px));
  width:calc(100% - 32px);max-width:428px;z-index:40;opacity:0;
  background:#2A2622;color:#fff;border-radius:16px;padding:11px 12px 11px 16px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 10px 30px -8px rgba(42,38,34,.5);
  transition:transform .22s cubic-bezier(.2,.8,.3,1),opacity .18s;
}
.selectbar.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.selectbar .txt{flex:1;min-width:0}
.selectbar .t1{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selectbar .t2{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.selectbar .go{background:#fff;color:#2A2622;border-radius:11px;padding:8px 14px;font-size:13px;font-weight:700;flex:none}
.selectbar .go:active{background:#EDE7DE}
.selectbar .cancel{color:rgba(255,255,255,.6);font-size:13px;padding:6px;flex:none}

/* ---------- 抽屉 ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(42,38,34,.34);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0 auto;max-width:460px;
  background:var(--bg);border-radius:22px 22px 0 0;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
  max-height:88vh;display:flex;flex-direction:column;
  box-shadow:0 -12px 40px -10px rgba(42,38,34,.3);
}
.sheet.on{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;border-radius:99px;background:#DED5C7;margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:14px 20px 6px;flex:none}
.sheet-title{font-size:18px;font-weight:700;letter-spacing:-.2px;flex:1;min-width:0;line-height:1.35}
.sheet-title .em{margin-right:6px}
.x{width:30px;height:30px;border-radius:50%;background:#EDE6DB;color:var(--ink2);display:grid;place-items:center;font-size:16px;flex:none;margin-top:-1px}
.x:active{background:#E2D9CC}
.sheet-body{padding:4px 20px 26px;overflow-y:auto;-webkit-overflow-scrolling:touch}

.meta-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.45}
.meta-row .ic{flex:none;width:16px;text-align:center;opacity:.8}
.note{
  margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.55;
}
.sec-h{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin:22px 0 9px}

/* 参与者分组 */
.bgroup{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:8px}
.bg-head{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--ink3);margin-bottom:7px}
.bg-head b{font-size:12.5px;color:var(--ink);font-weight:650}
.bg-head .cnt{margin-left:auto;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:#F7F2EA;border-radius:999px;
  padding:2px 9px 2px 2px;font-size:12px;color:var(--ink);
}
.chip .avatar{width:20px;height:20px;font-size:9.5px}
.chip.maybe{background:#FFF6E4;color:#8B6314;border:1px dashed #E8CD93;padding:2px 9px}
.chip.maybe .avatar{opacity:.55}
.chip.host::after{content:"发起";font-size:9px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 5px;margin-left:1px}
.chip .q{font-size:10px;opacity:.8}
.empty-note{font-size:12px;color:var(--ink3);padding:2px 0}
.silent{margin-top:9px;font-size:11.5px;color:var(--ink3);line-height:1.5}

/* 我的选择 */
.me-row{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:9px 10px 9px 13px;margin-bottom:8px;
}
.me-row .lbl{flex:1;min-width:0}
.me-row .l1{font-size:13px;font-weight:650}
.me-row .l2{font-size:10.5px;color:var(--ink3);margin-top:1px;font-variant-numeric:tabular-nums}
.btn-grp{display:flex;gap:4px;flex:none}
.tbtn{border-radius:9px;padding:6px 9px;font-size:11.5px;font-weight:650;background:#F3EEE6;color:var(--ink2);border:1px solid transparent;transition:all .12s;white-space:nowrap}
.tbtn:active{transform:scale(.96)}
.tbtn.on-in{background:#2C6B52;color:#fff}
.tbtn.on-maybe{background:#FFF0CC;color:#8B6314;border-color:#E8CD93}
.tbtn.on-out{background:#E7E1D7;color:#5F574E}
.legend{display:flex;gap:12px;margin:-3px 0 10px;font-size:10.5px;color:var(--ink3)}
.lg{display:inline-flex;align-items:center;gap:4px}
.lg::before{content:"";width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.lg.in::before{background:#2C6B52}
.lg.maybe::before{background:#E8B84B}
.lg.out::before{background:#C3B9AB}
.lg.none::before{background:#fff;border:1px dashed #C3B9AB}

.all-in{
  width:100%;background:#fff;border:1px dashed #D9CFBF;border-radius:13px;padding:10px;
  font-size:12.5px;color:var(--ink2);font-weight:600;margin-top:2px;
}
.all-in:active{background:#F7F2EA}
.share-row{display:flex;gap:8px;margin-top:10px}
.ghost-btn{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 8px;font-size:12.5px;font-weight:650;color:var(--ink2)}
.ghost-btn:active{background:#F7F2EA}

/* 手动复制弹层 */
.copy-overlay{position:fixed;inset:0;background:rgba(42,38,34,.42);z-index:90;display:grid;place-items:center;padding:20px}
.copy-box{background:var(--bg);border-radius:18px;padding:16px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.copy-title{font-size:13px;font-weight:650;margin-bottom:10px;color:var(--ink2)}
.copy-box textarea{
  width:100%;height:140px;border:1px solid var(--line);border-radius:12px;padding:11px;
  font-size:13px;line-height:1.6;resize:none;font-family:inherit;background:#fff;outline:none;color:var(--ink);
}
.copy-box .primary{margin-top:12px;box-shadow:none}

/* 创建表单 */
.form-label{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin:18px 0 8px}
.field{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.field::placeholder{color:#C3B9AB}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,103,74,.10)}
.field.sm{font-size:13.5px;padding:10px 13px;margin-top:8px}
.emoji-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.emoji-row::-webkit-scrollbar{display:none}
.emoji-pick{
  width:42px;height:42px;flex:none;border-radius:12px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;font-size:20px;transition:all .12s;
}
.emoji-pick:active{transform:scale(.94)}
.emoji-pick.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,103,74,.1)}
.span-pill{
  display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:#B4462B;
  border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:650;margin:2px 0 4px;
}
.primary{
  width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:14px;
  font-size:15px;font-weight:700;margin-top:22px;box-shadow:0 6px 16px -6px rgba(232,103,74,.6);
}
.primary:active{background:#D95B3E}
.primary:disabled{background:#E5DDD2;color:#A79C90;box-shadow:none}

/* 人员列表 */
.plist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.prow{
  display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);
  border-radius:13px;padding:10px 12px;text-align:left;width:100%;
}
.prow:active{background:#F7F2EA}
.prow .avatar{width:30px;height:30px;font-size:12px}
.prow .nm{font-size:14px;font-weight:600;flex:1}
.prow .tick{font-size:13px;color:var(--accent);font-weight:700}
.prow.on{border-color:var(--accent);background:var(--accent-soft)}
.sub-note{font-size:12px;color:var(--ink3);line-height:1.5;margin:2px 0 10px}

/* 小工具 */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:80;
  background:rgba(42,38,34,.92);color:#fff;border-radius:12px;padding:9px 15px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:all .2s;white-space:nowrap;max-width:80vw;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.footer-note{text-align:center;font-size:11px;color:#C3B9AB;margin-top:34px;line-height:1.7}
.footer-note button{color:#A79C90;text-decoration:underline;font-size:11px}

@media (max-width:360px){
  .app{padding-left:12px;padding-right:12px}
  .timeline{grid-auto-rows:72px}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand">周末活动小助手</div>
      <div class="subline">
        <button class="group-chip" data-action="open-group"><span id="groupEmoji">🏕️</span><span id="groupName">周末常玩组</span><span id="groupCount">· 6人</span></button>
        <span id="pendingMount"></span>
      </div>
    </div>
    <button class="me-chip" data-action="open-me">
      <span class="avatar" id="meAvatar">小</span>
      <span class="nm" id="meName">小明</span>
      <span class="caret">▾</span>
    </button>
  </header>

  <div id="hintMount"></div>
  <main id="days"></main>

  <div class="footer-note" id="footerMount"></div>
</div>

<div class="selectbar" id="selectbar"></div>
<div class="scrim" id="scrim" data-action="close-sheet"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   周末活动小助手 — 单文件 demo
   数据只存在本机浏览器，没有后端。
   ========================================================= */

const WEEKEND = {
  sat:{ name:"周六", date:"10月31日" },
  sun:{ name:"周日", date:"11月1日" }
};

const BLOCKS = [
  { id:"am",     label:"上午", time:"09:00–11:30", kind:"normal" },
  { id:"lunch",  label:"午饭", time:"11:30–13:30", kind:"meal"   },
  { id:"pm",     label:"下午", time:"13:30–17:30", kind:"normal" },
  { id:"dinner", label:"晚饭", time:"17:30–19:30", kind:"meal"   },
  { id:"eve",    label:"晚上", time:"19:30–22:30", kind:"night"  },
  { id:"late",   label:"夜宵", time:"22:30–",      kind:"late"   }
];

const PEOPLE = [
  { id:"p1", name:"老王",  color:"#E8674A" },
  { id:"p2", name:"阿花",  color:"#C97A2E" },
  { id:"p3", name:"小明",  color:"#5B6CB8" },

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);

}

/* ---------------- 小工具 ---------------- */
function person(id){ return PEOPLE.find(p=>p.id===id) || {id,name:"?",color:"#999"}; }
function actById(id){ return state.activities.find(a=>a.id===id); }
function blockIdx(id){ return BLOCKS.findIndex(b=>b.id===id); }
function blockBy(id){ return BLOCKS[blockIdx(id)]; }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function sameDayLabel(day){ return WEEKEND[day].name; }

function spanText(day, blocks){
  if(!blocks || !blocks.length) return "";
  const lo = blockIdx(blocks[0]);
  const hi = blockIdx(blocks[blocks.length-1]);
  const a = BLOCKS[lo], b = BLOCKS[hi];
  const range = lo===hi ? a.label : a.label+"–"+b.label;
  return WEEKEND[day].name + " · " + range;
}
function spanTimeText(blocks){
  const a = BLOCKS[blockIdx(blocks[0])];
  const b = BLOCKS[blockIdx(blocks[blocks.length-1])];
  return a.time.split("–")[0] + "–" + b.time.split("–")[1];
}
function avatarHTML(p, cls){
  return '<span class="avatar '+(cls||"")+'" style="background:'+p.color+'">'+esc(p.name.slice(0,1))+'</span>';
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("on"), 1800);
}

/* 复制到剪贴板：优先 Clipboard API，失败退回 execCommand */
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function inviteText(a){
  const lines = [];
  lines.push(a.emoji + " " + spanText(a.day, a.blocks) + " · " + a.title);
  if(a.place) lines.push("📍 " + a.place);
  if(a.note) lines.push(a.note);
  const n = Object.keys(a.joined).length;
  lines.push(n ? ("已经 " + n + " 人报名，来不来？") : "来不来？");
  return lines.join("\n");
}

function nudgeText(a){
  const silent = PEOPLE.filter(p => !a.joined[p.id] && p.id !== state.meId);
  return "还差你们 " + silent.length + " 个：" + silent.map(p=>p.name).join("、") + "\n" +
    spanText(a.day, a.blocks) + " · " + a.title + "\n来不来？点开选一下你能去的时段。";
}

/* 自动复制失败时的兜底：给一个可直接全选的文本框 */
function showCopyBox(text){
  const div = document.createElement("div");
  div.className = "copy-overlay";
  div.innerHTML =
    '<div class="copy-box">'+
      '<div class="copy-title">长按全选，复制这段文案</div>'+
      '<textarea readonly></textarea>'+
      '<button class="primary" data-copy-close>好了</button>'+
    '</div>';
  div.querySelector("textarea").value = text;
  document.body.appendChild(div);
  const ta = div.querySelector("textarea");
  setTimeout(()=>{ ta.focus(); ta.select(); }, 40);
  div.addEventListener("click", (e)=>{
    if(e.target === div || e.target.hasAttribute("data-copy-close")) div.remove();
  });
}

/* ---------------- 布局：给活动分配列 ---------------- */
function layoutDay(acts){
  const sorted = acts.slice().sort((a,b)=>blockIdx(a.blocks[0])-blockIdx(b.blocks[0]));
  const laneEnds = [];
  for(const a of sorted){
    const s = blockIdx(a.blocks[0]);
    const e = blockIdx(a.blocks[a.blocks.length-1]);
    let lane = laneEnds.findIndex(end => end < s);
    if(lane === -1){ lane = laneEnds.length; laneEnds.push(-1); }
    laneEnds[lane] = e;
    a._lane = lane; a._start = s; a._end = e;
  }
  return Math.max(1, laneEnds.length);
}

/* 周六、周日两列并行 */
function renderWeek(){
  let h = '<section class="week">';

  h += '<div class="week-head"><div></div>'+
       '<div class="wh-day"><b>周六</b><span>10月31日</span></div>'+
       '<div class="wh-day"><b>周日</b><span>11月1日</span></div></div>';

  h += '<div class="week-grid">';

  const occupied = { sat:new Set(), sun:new Set() };
  state.activities.forEach(a => a.blocks.forEach(b => occupied[a.day].add(b)));

  BLOCKS.forEach((b,i)=>{
    h += '<div class="slot-label" data-kind="'+b.kind+'" style="grid-row:'+(i+1)+';grid-column:1">'+
           '<span class="bl">'+b.label+'</span><span class="bt">'+b.time+'</span>'+
         '</div>';

    ["sat","sun"].forEach((day,ci)=>{
      const taken = occupied[day].has(b.id);
      let inSel = false;
      if(sel && sel.day === day){
        const lo = Math.min(sel.start, sel.end), hi = Math.max(sel.start, sel.end);
        inSel = i >= lo && i <= hi;
      }
      const cls = taken ? "slot taken" : ("slot free" + (inSel ? " insel" : ""));
      h += '<div class="'+cls+'" data-day="'+day+'" data-index="'+i+'" data-block="'+b.id+'" data-kind="'+b.kind+'" '+
           'style="grid-row:'+(i+1)+';grid-column:'+(ci+2)+'"></div>';
    });
  });

  ["sat","sun"].forEach((day,ci)=>{
    state.activities.filter(a=>a.day===day).forEach(a=>{
      const s = blockIdx(a.blocks[0]);
      const e = blockIdx(a.blocks[a.blocks.length-1]);
      h += renderActCard(a, ci+2, s, e);
    });
  });

  h += '</div></section>';
  return h;
}

function renderActCard(a, col, s, e){
  const mine = myStatusOf(a);
  const joiners = Object.keys(a.joined).filter(pid =>
    Object.values(a.joined[pid]).some(v => v==="in" || v==="maybe")
  );
  const shown = joiners.slice(0,3);
  const more = joiners.length - shown.length;

  let pile = shown.map(id=>avatarHTML(person(id))).join("");
  if(more > 0) pile += '<span class="more">+'+more+'</span>';

  let dot = "";
  if(mine === "in") dot = '<span class="st-dot in"></span>';
  else if(mine === "maybe") dot = '<span class="st-dot maybe"></span>';

  const span = e - s + 1;
  const noteHTML = (span >= 2 && a.note) ? '<div class="act-note">'+esc(a.note)+'</div>' : '';
  const segsHTML = span >= 3 ? renderMiniSegs(a) : '';

  return '<article class="act" data-action="open-act" data-id="'+a.id+'" data-span="'+span+'" '+
    'style="grid-row:'+(s+1)+'/'+(e+2)+';grid-column:'+col+';--c:'+a.color+'">'+
      dot+
      '<div class="act-top"><span class="act-emoji">'+a.emoji+'</span><span class="act-name">'+esc(a.title)+'</span></div>'+
      (span >= 2 && a.place ? '<div class="act-place">'+esc(a.place)+'</div>' : '')+
      noteHTML+
      segsHTML+
      '<div class="act-bottom"><div class="pile">'+pile+'</div></div>'+
    '</article>';
}

/* 卡片里的迷你分时段人数（窄列竖排） */
function renderMiniSegs(a){
  const rows = a.blocks.map(bid=>{
    const b = blockBy(bid);
    let ins = 0, maybes = 0;
    Object.keys(a.joined).forEach(pid=>{
      const st = a.joined[pid][bid];
      if(st === "in") ins++;
      else if(st === "maybe") maybes++;
    });
    const mine = (a.joined[state.meId] || {})[bid];
    let cls = "";
    if(mine === "in") cls = " mi-in";
    else if(mine === "maybe") cls = " mi-maybe";
    const tail = maybes ? '<span class="mq">+'+maybes+'?</span>' : "";
    return '<div class="mseg'+cls+'"><span class="ml">'+b.label+'</span><span class="mn">'+(ins || "—")+'</span>'+tail+'</div>';
  });
  return '<div class="mini-segs">'+rows.join("")+'</div>';
}

function myStatusOf(a){
  const m = a.joined[state.meId];
  if(!m) return null;
  const vals = Object.values(m);
  if(vals.includes("in")) return "in";
  if(vals.includes("maybe")) return "maybe";
  if(a.blocks.every(b => m[b] === "out")) return "out";
  return null;
}

/* 卡片上的分时段参与概览 */
function renderActSegs(a){
  const rows = a.blocks.map(bid=>{
    const b = blockBy(bid);
    let ins = 0, maybes = 0;
    Object.keys(a.joined).forEach(pid=>{
      const st = a.joined[pid][bid];
      if(st === "in") ins++;
      else if(st === "maybe") maybes++;
    });
    const mine = (a.joined[state.meId] || {})[bid];
    let cls = "";
    if(mine === "in") cls = " mine-in";
    else if(mine === "maybe") cls = " mine-maybe";
    else if(mine === "out") cls = " mine-out";
    const num = ins ? String(ins) : "—";
    const tail = maybes ? '<span class="q">+'+maybes+'?</span>' : "";
    return '<span class="seg'+cls+'"><span class="sl">'+b.label+'</span><span class="sn">'+num+'</span>'+tail+'</span>';
  });
  const silent = Math.max(0, PEOPLE.length - Object.keys(a.joined).length);
  if(silent > 0) rows.push('<span class="seg ghost">还差 '+silent+' 人</span>');
  return '<div class="act-segs">'+rows.join("")+'</div>';
}

function openSheet(mode, actId){

  activeActId = actId || null;
  document.getElementById("scrim").classList.add("on");
  document.getElementById("sheet").classList.add("on");
  renderSheet();

function closeSheet(){
  sheetMode = null; activeActId = null; draft = null;
  document.getElementById("scrim").classList.remove("on");
  document.getElementById("sheet").classList.remove("on");
}

function renderSheet(){
  const sheet = document.getElementById("sheet");
  if(!sheetMode){ sheet.innerHTML = ""; lastSheetMode = null; return; }

  const prevBody = sheet.querySelector(".sheet-body");
  const keepScroll = (lastSheetMode === sheetMode && prevBody) ? prevBody.scrollTop : 0;

  let body = "";
  if(sheetMode==="detail") body = renderDetail(actById(activeActId));
  else if(sheetMode==="create") body = renderCreate();
  else if(sheetMode==="me") body = renderMePicker();
  else if(sheetMode==="group") body = renderGroup();

  sheet.innerHTML = '<div class="sheet-handle"></div>' + body;

  const nextBody = sheet.querySelector(".sheet-body");
  if(nextBody) nextBody.scrollTop = keepScroll;
  lastSheetMode = sheetMode;
}

/* ---------- 活动详情 ---------- */
function renderDetail(a){
  if(!a) return "";
  const entries = Object.keys(a.joined);
  const active = entries.filter(pid => Object.values(a.joined[pid]).some(v => v==="in" || v==="maybe"));
  let inCount = 0, maybeCount = 0;
  active.forEach(pid=>{
    const vals = Object.values(a.joined[pid]);
    if(vals.includes("in")) inCount++;
    else maybeCount++;
  });
  const host = person(a.host);

  let h = '<div class="sheet-head">'+
    '<div class="sheet-title"><span class="em">'+a.emoji+'</span>'+esc(a.title)+'</div>'+
    '<button class="x" data-action="close-sheet">×</button>'+
  '</div>';

  h += '<div class="sheet-body">';
  h += '<div class="meta-row"><span class="ic">🕐</span><span>'+spanText(a.day, a.blocks)+'<br><span style="color:var(--ink3);font-size:12px">'+spanTimeText(a.blocks)+'</span></span></div>';
  h += '<div class="meta-row"><span class="ic">👤</span><span>'+esc(host.name)+' 发起</span></div>';
  if(a.place) h += '<div class="meta-row"><span class="ic">📍</span><span>'+esc(a.place)+'</span></div>';
  if(a.note) h += '<div class="note">'+esc(a.note)+'</div>';

  /* 谁去 */
  h += '<div class="sec-h">谁去 · 确定 '+inCount+(maybeCount?' · 待定 '+maybeCount:'')+'</div>';
  if(!active.length){
    h += '<div class="empty-note">还没有人报名，你可以当第一个。</div>';
  }else{
    a.blocks.forEach(bid=>{
      const b = blockBy(bid);
      const ins = [], maybes = [];
      entries.forEach(pid=>{
        const st = a.joined[pid][bid];
        if(st==="in") ins.push(pid);
        else if(st==="maybe") maybes.push(pid);
      });
      if(!ins.length && !maybes.length) return;

      h += '<div class="bgroup"><div class="bg-head"><b>'+b.label+'</b><span>'+b.time+'</span>'+
           '<span class="cnt">'+(ins.length+maybes.length)+' 人</span></div><div class="chips">';
      ins.forEach(pid=>{
        const p = person(pid);
        h += '<span class="chip '+(pid===a.host?"host":"")+'">'+avatarHTML(p)+esc(p.name)+'</span>';
      });
      maybes.forEach(pid=>{
        const p = person(pid);
        h += '<span class="chip maybe">'+avatarHTML(p)+esc(p.name)+'<span class="q">待定</span></span>';
      });
      h += '</div></div>';
    });

    const silent = PEOPLE.filter(p=>!a.joined[p.id]);
    if(silent.length){
      h += '<div class="silent">还没表态：'+silent.map(p=>esc(p.name)).join("、")+'</div>';
    }
  }

  /* 我的选择 */
  h += '<div class="sec-h">我要参加哪些时段？</div>';
  h += '<div class="legend"><span class="lg in">参加</span><span class="lg maybe">待定</span><span class="lg out">不去</span><span class="lg none">没表态</span></div>';
  const mine = a.joined[state.meId] || {};

  a.blocks.forEach(bid=>{
    const b = blockBy(bid);
    const st = mine[bid] || "";
    h += '<div class="me-row">'+
      '<div class="lbl"><div class="l1">'+b.label+'</div><div class="l2">'+b.time+'</div></div>'+
      '<div class="btn-grp">'+
        '<button class="tbtn '+(st==="in"?"on-in":"")+'" data-action="set-status" data-id="'+a.id+'" data-block="'+bid+'" data-status="in">参加</button>'+
        '<button class="tbtn '+(st==="maybe"?"on-maybe":"")+'" data-action="set-status" data-id="'+a.id+'" data-block="'+bid+'" data-status="maybe">待定</button>'+
        '<button class="tbtn '+(st==="out"?"on-out":"")+'" data-action="set-status" data-id="'+a.id+'" data-block="'+bid+'" data-status="out">不去</button>'+
      '</div>'+
    '</div>';
  });

  h += '<button class="all-in" data-action="all-in" data-id="'+a.id+'">全部时段都参加</button>';

  const silentList = PEOPLE.filter(p=>!a.joined[p.id] && p.id !== state.meId);
  h += '<div class="share-row">';
  h += '<button class="ghost-btn" data-action="copy-invite" data-id="'+a.id+'">复制邀请文案</button>';
  if(silentList.length){
    h += '<button class="ghost-btn" data-action="nudge" data-id="'+a.id+'">催一下 '+silentList.length+' 人</button>';
  }
  h += '</div>';

  h += '</div>';
  return h;
}

    h += '<button class="prow '+(p.id===state.meId?"on":"")+'" data-action="set-me" data-id="'+p.id+'">'+
      avatarHTML(p) + '<span class="nm">'+esc(p.name)+'</span>'+
      (p.id===state.meId?'<span class="tick">当前</span>':'')+
    '</button>';
  });
  h += '</div></div>';
  return h;
}

/* ---------- 群组 ---------- */
function renderGroup(){
  let h = '<div class="sheet-head">'+
    '<div class="sheet-title"><span class="em">'+state.groupEmoji+'</span>'+esc(state.groupName)+'</div>'+
    '<button class="x" data-action="close-sheet">×</button>'+
  '</div>';
  h += '<div class="sheet-body">';
  h += '<div class="sub-note">群里固定这几个人。发活动时不用每次重新找人，一次拉群，之后一直用。</div>';
  h += '<div class="plist">';
  PEOPLE.forEach(p=>{
    h += '<div class="prow">'+avatarHTML(p)+'<span class="nm">'+esc(p.name)+'</span></div>';
  });
  h += '</div>';
  h += '<button class="all-in" style="margin-top:12px" data-action="fake-invite">＋ 邀请朋友加入群组</button>';
  h += '</div>';
  return h;
}

/* ---------------- 事件 ---------------- */
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action==="dismiss-hint"){
    state.hintDismissed = true; saveState(); renderHint(); return;
  }
  if(action==="reset"){
    if(confirm("重置为演示数据？你刚才的报名会清掉。")){
      state = clone(SEED); saveState(); sel=null; closeSheet(); renderAll(); toast("已重置");
    }
    return;
  }
  if(action==="open-act"){
    openSheet("detail", el.dataset.id); return;
  }
  if(action==="close-sheet"){ closeSheet(); return; }
  if(action==="open-me"){ openSheet("me"); return; }
  if(action==="open-group"){ openSheet("group"); return; }
  if(action==="fake-invite"){ toast("正式版会生成一个群组链接"); return; }

  if(action==="copy-invite"){
    const a = actById(el.dataset.id);
    if(!a) return;
    const t = inviteText(a);
    copyText(t).then(ok => { if(ok) toast("邀请文案已复制，去群里粘贴"); else showCopyBox(t); });
    return;
  }

  if(action==="nudge"){
    const a = actById(el.dataset.id);
    if(!a) return;
    const t = nudgeText(a);
    copyText(t).then(ok => { if(ok) toast("催办文案已复制，去群里粘贴"); else showCopyBox(t); });
    return;
  }

  if(action==="set-me"){
    state.meId = el.dataset.id; saveState(); renderAll(); renderSheet(); return;
  }

  if(action==="clear-sel"){ sel = null; renderDays(); renderSelectBar(); return; }

  if(action==="new-act"){
    if(!sel) return;
    const lo = Math.min(sel.start, sel.end), hi = Math.max(sel.start, sel.end);
    const blocks = BLOCKS.slice(lo, hi+1).map(b=>b.id);
    // 检查是否和已有活动冲突
    const clash = state.activities.find(a=>a.day===sel.day && a.blocks.some(b=>blocks.includes(b)));
    if(clash){ toast("和「"+clash.title+"」时间重叠了"); return; }
    draft = { day:sel.day, blocks, emoji:"🍲" };
    sel = null;
    renderDays(); renderSelectBar();
    openSheet("create");
    return;
  }

  if(action==="pick-emoji"){
    draft.emoji = el.dataset.emoji;
    // 只更新选中态，避免输入框失焦重渲染
    document.querySelectorAll("#fEmoji .emoji-pick").forEach(b=>{
      b.classList.toggle("on", b.dataset.emoji===draft.emoji);
    });
    return;
  }

  if(action==="create-act"){
    const title = (document.getElementById("fTitle").value || "").trim();
    if(!title){ toast("先给活动起个名字"); document.getElementById("fTitle").focus(); return; }
    const place = (document.getElementById("fPlace").value || "").trim();
    const note  = (document.getElementById("fNote").value || "").trim();
    const colors = ["#E8674A","#4C8C6B","#5B6CB8","#9B6BB5","#C97A2E","#3E8BA8"];

    const a = {
      id:"a"+Date.now(),
      title, emoji:draft.emoji, color:colors[state.activities.length % colors.length],
      day:draft.day, blocks:draft.blocks.slice(), host:state.meId,
      place, note,
      joined:{}
    };
    state.activities.push(a);
    saveState();
    draft = null;
    closeSheet();
    renderAll();
    toast("活动已发起");
    setTimeout(()=>openSheet("detail", a.id), 220);
    return;
  }

  if(action==="set-status"){
    const id = el.dataset.id, bid = el.dataset.block, st = el.dataset.status;
    const a = actById(id); if(!a) return;
    if(!a.joined[state.meId]) a.joined[state.meId] = {};
    const cur = a.joined[state.meId][bid];
    if(cur === st) delete a.joined[state.meId][bid];
    else a.joined[state.meId][bid] = st;
    if(!Object.keys(a.joined[state.meId]).length) delete a.joined[state.meId];
    saveState();
    renderDays();
    renderSheet();
    return;
  }

  if(action==="all-in"){
    const a = actById(el.dataset.id); if(!a) return;
    a.joined[state.meId] = {};
    a.blocks.forEach(b=>{ a.joined[state.meId][b] = "in"; });
    saveState();
    renderDays(); renderSheet(); toast("已全部参加");
    return;
  }
});

/* ---------------- 时间块点选 ---------------- */
document.addEventListener("click", (e)=>{
  const slot = e.target.closest(".slot.free");
  if(!slot) return;
  const day = slot.dataset.day;
  const idx = parseInt(slot.dataset.index,10);

  if(!sel || sel.day !== day){
    sel = { day, start:idx, end:idx };
  }else{
    if(idx === sel.start - 1) sel.start = idx;
    else if(idx === sel.end + 1) sel.end = idx;
    else if(idx >= sel.start && idx <= sel.end){
      if(sel.start === sel.end) sel = null;
      else if(idx === sel.start) sel.start++;
      else if(idx === sel.end) sel.end--;
    }else{
      sel = { day, start:idx, end:idx };
    }
  }
  renderDays();
  renderSelectBar();
});

/* ---------------- 初始化 ---------------- */
function renderAll(){
  renderHeader();
  renderHint();
  renderDays();
  renderSelectBar();
}

renderAll();
</script>
